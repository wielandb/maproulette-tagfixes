name: Test Overpass and stopsign generation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r challenges/stopsign-directions/requirements.txt "shapely>=2"
      - name: Test Overpass failover and area selection
        run: python -m unittest discover -s tests -p "test_overpass*.py" -v
      - name: Test stopsign generation and output preservation
        run: python -m unittest discover -s tests -p "test_stopsign*.py" -v
