name: Update Social Workshop Challenge Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: challenge-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-social-workshop:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest tests.test_geofabrik tests.test_social_workshop -v
      - name: Generate tasks from Germany PBF
        run: python challenges/social_workshop/generate.py
      - name: Commit challenge data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- challenges/social_workshop/social_workshop.json
          if ! git diff --cached --quiet; then
            git commit -m "Update social workshop challenge data"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
